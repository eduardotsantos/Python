{% extends "base.html" %}
{% block title %}{{ _('Editar') if program else _('Novo') }} {{ _('Programa') }} - Orion P&D{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url_for('programs.list_programs') }}" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-left"></i>
    </a>
    <h4 class="fw-bold mb-0">
        <i class="bi bi-collection text-primary"></i>
        {{ _('Editar Programa') if program else _('Novo Programa') }}
    </h4>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">{{ _('Codigo') }} *</label>
                    <input type="text" class="form-control" name="code" value="{{ program.code if program else '' }}" required>
                </div>
                <div class="col-md-9">
                    <label class="form-label">{{ _('Nome') }} *</label>
                    <input type="text" class="form-control" name="name" value="{{ program.name if program else '' }}" required>
                </div>

                <div class="col-12">
                    <label class="form-label">{{ _('Descricao') }}</label>
                    <textarea class="form-control" name="description" rows="2">{{ program.description if program else '' }}</textarea>
                </div>

                <div class="col-12">
                    <label class="form-label">{{ _('Objetivo') }}</label>
                    <textarea class="form-control" name="objective" rows="2">{{ program.objective if program else '' }}</textarea>
                </div>

                <div class="col-md-4">
                    <label class="form-label">{{ _('Data de Inicio') }}</label>
                    <input type="date" class="form-control" name="start_date" value="{{ program.start_date.strftime('%Y-%m-%d') if program and program.start_date else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ _('Data de Termino') }}</label>
                    <input type="date" class="form-control" name="end_date" value="{{ program.end_date.strftime('%Y-%m-%d') if program and program.end_date else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ _('Orcamento Planejado') }}</label>
                    <input type="number" step="0.01" class="form-control" name="budget" value="{{ program.budget if program else 0 }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ _('Gestor') }}</label>
                    <select class="form-select" name="manager_id">
                        <option value="">{{ _('Selecione...') }}</option>
                        {% for user in users %}
                        <option value="{{ user.id }}" {% if program and program.manager_id == user.id %}selected{% endif %}>
                            {{ user.full_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ _('Status') }}</label>
                    <select class="form-select" name="status">
                        <option value="Ativo" {% if not program or program.status == 'Ativo' %}selected{% endif %}>{{ _('Ativo') }}</option>
                        <option value="Suspenso" {% if program and program.status == 'Suspenso' %}selected{% endif %}>{{ _('Suspenso') }}</option>
                        <option value="Concluido" {% if program and program.status == 'Concluido' %}selected{% endif %}>{{ _('Concluido') }}</option>
                        <option value="Cancelado" {% if program and program.status == 'Cancelado' %}selected{% endif %}>{{ _('Cancelado') }}</option>
                    </select>
                </div>
            </div>

            <hr class="my-4">
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {{ _('Salvar') }}
                </button>
                <a href="{{ url_for('programs.list_programs') }}" class="btn btn-outline-secondary">{{ _('Cancelar') }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
